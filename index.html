<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Desk Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Project created by Christian Silva, ADS student at Uninter. -->

<div class="container">
    <h1>Support Desk Simulation</h1>
    <p class="subtitle">Simple ticket management system for help desk practice.</p>

    <div class="ticket-form">
        <input type="text" id="ticketTitle" placeholder="Ticket title">
        <textarea id="ticketDescription" placeholder="Describe the issue"></textarea>

        <select id="ticketPriority">
            <option value="Low">Low Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="High">High Priority</option>
        </select>

        <button onclick="createTicket()">Create Ticket</button>
        <p id="message"></p>
    </div>

    <div class="filters">
        <button onclick="filterTickets('All')">All</button>
        <button onclick="filterTickets('Open')">Open</button>
        <button onclick="filterTickets('In Progress')">In Progress</button>
        <button onclick="filterTickets('Closed')">Closed</button>
    </div>

    <div id="ticketList" class="ticket-list"></div>
</div>

<script src="script.js"></script>
</body>
</html>
